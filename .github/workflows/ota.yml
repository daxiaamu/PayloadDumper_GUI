name: Publish OTA metadata
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v1.0.0)
        required: true
permissions:
  contents: write
concurrency:
  group: stable-ota-metadata
  cancel-in-progress: false
jobs:
  metadata:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify both Release assets and five mirrors per architecture
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python tools/publish_update.py --tag "$RELEASE_TAG"
      - name: Commit immutable manifest and stable pointer together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/manifests updates/stable/latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish verified stable OTA metadata'
          git pull --rebase origin main
          git push origin HEAD:main
